services:
  archive:
    image: nocheh-services:dev
    build: {target: development}
    command: [npm, run, dev]
    develop:
      watch: &ts-watch
        - {action: sync+restart, path: ./src, target: /app/src}
        - {action: sync+restart, path: ./test, target: /app/test}
        - {action: rebuild, path: ./package-lock.json}
        - {action: rebuild, path: ./tsconfig.json}
        - {action: rebuild, path: ./scripts/build.mjs}
  worker:
    image: nocheh-services:dev
    build: {target: development}
    command: [npm, run, dev]
    develop: {watch: *ts-watch}
  guard:
    image: nocheh-services:dev
    build: {target: development}
    command: [npm, run, dev]
    develop: {watch: *ts-watch}
  hermes:
    develop:
      watch:
        - {action: sync+restart, path: ./integrations, target: /workspace/integrations}
        - {action: rebuild, path: ./deploy/hermes.Dockerfile}
