# Live-reload development stack.
#   docker compose -f docker-compose.dev.yml up --build
# Backend  -> http://127.0.0.1:3000  (tsc --watch + node --watch; recompiles & restarts on change)
# Frontend -> http://127.0.0.1:5173/app  (Vite HMR; instant UI updates)
#
# Source is bind-mounted; node_modules are kept in anonymous volumes so the
# container's native better-sqlite3 build is not overwritten by the host's.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev:watch
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/nocheh.sqlite
      LOCAL_ENCRYPTION_SECRET: ${LOCAL_ENCRYPTION_SECRET:-local-development-secret-change-me}
      MESSAGE_ANALYSIS_MODE: ${MESSAGE_ANALYSIS_MODE:-immediate}
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - web_node_modules:/app/web/node_modules
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm --prefix web run dev -- --host
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    environment:
      # Proxy /api and /telegram to the backend container, and poll for file
      # changes so HMR works across the Docker bind mount.
      API_PROXY_TARGET: http://backend:3000
      VITE_USE_POLLING: "true"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - web_node_modules:/app/web/node_modules
    depends_on:
      - backend

volumes:
  backend_node_modules:
  web_node_modules:
