services:
  nocheh:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/nocheh.sqlite
      LOCAL_ENCRYPTION_SECRET: ${LOCAL_ENCRYPTION_SECRET:-local-development-secret-change-me}
      MESSAGE_ANALYSIS_MODE: ${MESSAGE_ANALYSIS_MODE:-batch}
      LIVE_ANALYSIS_INTERVAL_SECONDS: ${LIVE_ANALYSIS_INTERVAL_SECONDS:-300}
      LIVE_MAX_MESSAGES_PER_BATCH: ${LIVE_MAX_MESSAGES_PER_BATCH:-50}
      MAX_AI_CONTEXT_TOKENS: ${MAX_AI_CONTEXT_TOKENS:-4000}
      MAX_RETRIEVED_MEMORIES: ${MAX_RETRIEVED_MEMORIES:-12}
      MAX_RECENT_MESSAGES: ${MAX_RECENT_MESSAGES:-30}
      SUMMARY_EVERY_MESSAGES: ${SUMMARY_EVERY_MESSAGES:-100}
      SUMMARY_EVERY_MINUTES: ${SUMMARY_EVERY_MINUTES:-60}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - nocheh
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
