name: nocheh

x-service: &service
  image: nocheh-services:local
  build:
    context: .
    target: runtime
    args:
      LOCAL_UID: ${NOCHEH_UID:-1000}
      LOCAL_GID: ${NOCHEH_GID:-1000}
  user: "${NOCHEH_UID:-1000}:${NOCHEH_GID:-1000}"
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  environment: &environment
    PGHOST: postgres
    PGUSER: nocheh
    PGDATABASE: nocheh
    PGPASSWORD_FILE: /run/secrets/database_password
    SERVICE_TOKEN_FILE: /run/secrets/service_token
    NOCHEH_DATA_DIR: /data
    HERMES_URL: http://hermes:8781
    GUARD_MODE: ${NOCHEH_GUARD_MODE:-auto}
  secrets: [database_password, service_token]
  volumes:
    - ${NOCHEH_STATE_DIR:-./data/local}/files:/data/files
    - ${NOCHEH_STATE_DIR:-./data/local}/spool:/data/spool
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:8780/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 10s

services:
  postgres:
    image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    restart: unless-stopped
    environment:
      POSTGRES_USER: nocheh
      POSTGRES_DB: nocheh
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nocheh -d nocheh"]
      interval: 3s
      timeout: 3s
      retries: 20

  archive:
    <<: *service
    environment:
      <<: *environment
      NOCHEH_SERVICE: archive
    ports: ["127.0.0.1:${NOCHEH_PORT:-8780}:8780"]
    depends_on:
      postgres: {condition: service_healthy}

  worker:
    <<: *service
    environment:
      <<: *environment
      NOCHEH_SERVICE: worker
    depends_on:
      archive: {condition: service_healthy}

  guard:
    <<: *service
    environment:
      <<: *environment
      NOCHEH_SERVICE: guard
    depends_on:
      archive: {condition: service_healthy}

  hermes:
    image: nocheh-hermes:local
    build:
      context: .
      dockerfile: deploy/hermes.Dockerfile
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    user: "${NOCHEH_UID:-1000}:${NOCHEH_GID:-1000}"
    init: true
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      SERVICE_TOKEN_FILE: /run/secrets/service_token
      NOCHEH_MODEL: ${NOCHEH_MODEL:-gpt-5.6-sol}
      ARCHIVE_URL: http://archive:8780
      GUARD_URL: http://guard:8780
    secrets: [service_token]
    volumes:
      - ${NOCHEH_STATE_DIR:-./data/local}/hermes:/workspace/data/local/hermes
      - ${NOCHEH_STATE_DIR:-./data/local}/reports:/reports
      - ${NOCHEH_STATE_DIR:-./data/local}/files:/data/files:ro
      - ${NOCHEH_STATE_DIR:-./data/local}/spool:/data/spool
    depends_on:
      archive: {condition: service_healthy}
      guard: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8781/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres_data:

secrets:
  database_password:
    file: ${NOCHEH_STATE_DIR:-./data/local}/secrets/database_password
  service_token:
    file: ${NOCHEH_STATE_DIR:-./data/local}/secrets/service_token
