services:
  nocheh:
    build: .
    restart: unless-stopped
    # Publish the dashboard to the host for local use. On a VPS fronted by the
    # Cloudflare Tunnel this is optional; bind to localhost so it is not exposed
    # publicly. Override with HOST_PORT if 3000 is taken.
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/nocheh.sqlite
      LOCAL_ENCRYPTION_SECRET: ${LOCAL_ENCRYPTION_SECRET:-local-development-secret-change-me}
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME:-}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:-}
      APP_AUTH_SESSION_SECRET: ${APP_AUTH_SESSION_SECRET:-}
      APP_AUTH_SECURE_COOKIE: ${APP_AUTH_SECURE_COOKIE:-false}
      # Model roles. Credentials are per provider; model ids are per role.
      # A blank role provider disables that role only; a blank AI_PROVIDER keeps
      # text analysis in dry-run mode.
      # Values are read from the host .env by compose interpolation.
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_IMAGE_PROVIDER: ${AI_IMAGE_PROVIDER:-}
      AI_AUDIO_PROVIDER: ${AI_AUDIO_PROVIDER:-}
      AI_GUARD_PROVIDER: ${AI_GUARD_PROVIDER:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-}
      NVIDIA_IMAGE_MODEL: ${NVIDIA_IMAGE_MODEL:-}
      NVIDIA_AUDIO_MODEL: ${NVIDIA_AUDIO_MODEL:-}
      NVIDIA_GUARD_MODEL: ${NVIDIA_GUARD_MODEL:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-}
      NVIDIA_JSON_RESPONSE_FORMAT: ${NVIDIA_JSON_RESPONSE_FORMAT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_GUARD_MODEL: ${ANTHROPIC_GUARD_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-}
      GEMINI_AUDIO_MODEL: ${GEMINI_AUDIO_MODEL:-}
      GEMINI_GUARD_MODEL: ${GEMINI_GUARD_MODEL:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      MESSAGE_ANALYSIS_MODE: ${MESSAGE_ANALYSIS_MODE:-batch}
      LIVE_ANALYSIS_INTERVAL_SECONDS: ${LIVE_ANALYSIS_INTERVAL_SECONDS:-300}
      LIVE_MAX_MESSAGES_PER_BATCH: ${LIVE_MAX_MESSAGES_PER_BATCH:-50}
      FLUSH_SWEEP_INTERVAL_SECONDS: ${FLUSH_SWEEP_INTERVAL_SECONDS:-60}
      MAX_AI_CONTEXT_TOKENS: ${MAX_AI_CONTEXT_TOKENS:-4000}
      MAX_AI_OUTPUT_TOKENS: ${MAX_AI_OUTPUT_TOKENS:-4000}
      MAX_RETRIEVED_MEMORIES: ${MAX_RETRIEVED_MEMORIES:-12}
      MAX_RECENT_MESSAGES: ${MAX_RECENT_MESSAGES:-30}
      SUMMARY_EVERY_MESSAGES: ${SUMMARY_EVERY_MESSAGES:-100}
      SUMMARY_EVERY_MINUTES: ${SUMMARY_EVERY_MINUTES:-60}
      MEDIA_MAX_ATTACHMENTS_PER_WINDOW: ${MEDIA_MAX_ATTACHMENTS_PER_WINDOW:-8}
      MEDIA_MAX_DOWNLOAD_BYTES: ${MEDIA_MAX_DOWNLOAD_BYTES:-20971520}
      MEDIA_MAX_INLINE_BYTES: ${MEDIA_MAX_INLINE_BYTES:-5242880}
      SECRET_GUARD_MAX_ATTEMPTS: ${SECRET_GUARD_MAX_ATTEMPTS:-5}
      SECRET_GUARD_MAX_INPUT_CHARACTERS: ${SECRET_GUARD_MAX_INPUT_CHARACTERS:-24000}
      SECRET_GUARD_MAX_OUTPUT_TOKENS: ${SECRET_GUARD_MAX_OUTPUT_TOKENS:-4000}
      SECRET_GUARD_ON_FAILURE: ${SECRET_GUARD_ON_FAILURE:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
    volumes:
      - ./data:/app/data
      # The dashboard writes provider keys and the Telegram token to /app/.env.
      # Mounting the host file keeps those writes across container rebuilds and
      # keeps one source of truth for compose interpolation and the app.
      # The host .env must exist before `up`; scripts/bootstrap.sh guarantees it,
      # otherwise Docker creates a directory here.
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  # Ingress for VPS deployments. Started only with the "tunnel" profile so it
  # does not crash-loop locally when CLOUDFLARE_TUNNEL_TOKEN is unset:
  #   docker compose --profile tunnel up -d --build
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - nocheh
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
