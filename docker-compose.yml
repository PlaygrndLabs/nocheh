name: nocheh

x-logging: &logging
  # Every container's Docker log is rotated so a looping service cannot fill the disk.
  driver: json-file
  options:
    max-size: ${NOCHEH_LOG_MAX_SIZE:-10m}
    max-file: ${NOCHEH_LOG_MAX_FILES:-3}

x-service: &service
  logging: *logging
  image: nocheh-services:local
  build:
    context: .
    target: runtime
    args:
      LOCAL_UID: ${NOCHEH_UID:-1000}
      LOCAL_GID: ${NOCHEH_GID:-1000}
  user: "${NOCHEH_UID:-1000}:${NOCHEH_GID:-1000}"
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  environment: &environment
    PGHOST: nocheh-db
    NOCHEH_STORAGE_LAYOUT: original-only-v1
    NOCHEH_ARCHIVE_PASSWORD: ${NOCHEH_ARCHIVE_PASSWORD:?Run ./bin/nocheh init}
    NOCHEH_DERIVED_PASSWORD: ${NOCHEH_DERIVED_PASSWORD:?Run ./bin/nocheh init}
    NOCHEH_CONTROL_PASSWORD: ${NOCHEH_CONTROL_PASSWORD:?Run ./bin/nocheh init}
    SERVICE_TOKEN: ${SERVICE_TOKEN:?Run ./bin/nocheh init}
    NOCHEH_DATA_DIR: /data
    HERMES_URL: http://hermes:8781
    HONCHO_URL: http://honcho-memory:8000
    # The reply model: the security broker admits only this model and provider address.
    NOCHEH_MODEL: ${NOCHEH_REPLY_ROUTE_MODEL:-${NOCHEH_MODEL:-claude-sonnet-5-5}}
    NOCHEH_REPLY_ROUTE_URL: ${NOCHEH_REPLY_ROUTE_URL:-}
    NOCHEH_GUARD_ROUTE_MODEL: ${NOCHEH_GUARD_ROUTE_MODEL:-${NOCHEH_MODEL:-claude-sonnet-5-5}}
    GUARD_MODE: ${NOCHEH_GUARD_MODE:-on}
    NOCHEH_PARALLEL_GUARD_CHECKS: ${NOCHEH_PARALLEL_GUARD_CHECKS:-3}
    TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
    TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
    TELEGRAM_GROUP_IDS: ${TELEGRAM_GROUP_IDS:-}
    TELEGRAM_GROUP_ACCESS: ${TELEGRAM_GROUP_ACCESS:-{}}
    TELEGRAM_TOPIC_MEMORY: ${TELEGRAM_TOPIC_MEMORY:-group}
    NOCHEH_DASHBOARD_PORT: ${NOCHEH_DASHBOARD_PORT:-8783}
    NOCHEH_DASHBOARD_URL: ${NOCHEH_DASHBOARD_URL:-}
  volumes:
    - ${NOCHEH_STATE_DIR:-./data/local}/files:/data/files
    - ${NOCHEH_STATE_DIR:-./data/local}/spool:/data/spool
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:8780/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 10s

x-honcho-runtime: &honcho-runtime
  logging: *logging
  image: nocheh-honcho:608aec8a
  build:
    context: ./data/compat/upstreams/honcho
    dockerfile: ${NOCHEH_HONCHO_STATE_DIR:-./data/local/honcho}/honcho.Dockerfile
  profiles: [honcho]
  env_file: [{path: "${NOCHEH_HONCHO_STATE_DIR:-./data/local/honcho}/honcho.env", required: false}]
  networks: [honcho-isolated]
  restart: unless-stopped
  stop_grace_period: 120s

x-management: &management
  logging: *logging
  image: nocheh-management:local
  build: {context: ., target: management}
  user: "${NOCHEH_UID:-1000}:${NOCHEH_GID:-1000}"
  group_add: ["${NOCHEH_DOCKER_GID:-0}"]
  init: true
  restart: unless-stopped
  stop_grace_period: 480s
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment:
    NOCHEH_CONTAINER: "1"
    NOCHEH_INSTALLATION_ROOT: ${NOCHEH_INSTALLATION_ROOT:-${PWD}}
    NOCHEH_STATE_DIR: ${NOCHEH_STATE_DIR:-${PWD}/data/local}
    NOCHEH_DASHBOARD_PORT: ${NOCHEH_DASHBOARD_PORT:-8783}
    COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-nocheh}
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ${NOCHEH_INSTALLATION_ROOT:-${PWD}}:${NOCHEH_INSTALLATION_ROOT:-${PWD}}
    - ${NOCHEH_STATE_DIR:-${PWD}/data/local}:${NOCHEH_STATE_DIR:-${PWD}/data/local}
    - ${NOCHEH_HONCHO_STATE_DIR:-${PWD}/data/local/honcho}:${NOCHEH_HONCHO_STATE_DIR:-${PWD}/data/local/honcho}
  networks: [default]

services:
  nocheh-reset-setup:
    logging: *logging
    image: nocheh-services:local
    build:
      context: .
      target: runtime
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    profiles: [reset]
    user: "${NOCHEH_UID:-1000}:${NOCHEH_GID:-1000}"
    init: true
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [node, dist/src/stores/reset-setup-cli.js, /reset/setup.json]
    environment:
      PGHOST: nocheh-db
      PGPASSWORD: ${POSTGRES_PASSWORD:?Installation administrator credential required}
      NOCHEH_DATA_DIR: /data
      NOCHEH_STORAGE_LAYOUT: original-only-v1
      NOCHEH_RESET_SETUP: "1"
      NOCHEH_ARCHIVE_PASSWORD: ${NOCHEH_ARCHIVE_PASSWORD:?Archive credential required}
      NOCHEH_DERIVED_PASSWORD: ${NOCHEH_DERIVED_PASSWORD:?Derivative credential required}
      NOCHEH_CONTROL_PASSWORD: ${NOCHEH_CONTROL_PASSWORD:?Control credential required}
      INNGEST_POSTGRES_PASSWORD: ${INNGEST_POSTGRES_PASSWORD:?Workflow credential required}
    volumes:
      - ${NOCHEH_STATE_DIR:-./data/local}/spool:/data/spool:ro
      - ${NOCHEH_STATE_DIR:-./data/local}/admin/reset:/reset:ro
    depends_on:
      nocheh-db: {condition: service_healthy}
  nocheh-reset-baseline:
    logging: *logging
    image: nocheh-services:local
    build:
      context: .
      target: runtime
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    profiles: [reset]
    user: "${NOCHEH_UID:-1000}:${NOCHEH_GID:-1000}"
    init: true
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [node, dist/src/stores/reset-baseline-cli.js, /reset/setup.json]
    environment:
      PGHOST: nocheh-db
      NOCHEH_STORAGE_LAYOUT: original-only-v1
      NOCHEH_RESET_BASELINE: "1"
      NOCHEH_ARCHIVE_PASSWORD: ${NOCHEH_ARCHIVE_PASSWORD:?Archive credential required}
      NOCHEH_DERIVED_PASSWORD: ${NOCHEH_DERIVED_PASSWORD:?Derivative credential required}
      NOCHEH_CONTROL_PASSWORD: ${NOCHEH_CONTROL_PASSWORD:?Control credential required}
    volumes:
      - ${NOCHEH_STATE_DIR:-./data/local}/admin/reset:/reset:ro
    depends_on:
      nocheh-db: {condition: service_healthy}
  nocheh-reset-state:
    logging: *logging
    image: nocheh-services:local
    build:
      context: .
      target: runtime
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    profiles: [reset]
    user: "${NOCHEH_UID:-1000}:${NOCHEH_GID:-1000}"
    init: true
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [node, dist/src/stores/reset-state-cli.js]
    environment:
      PGHOST: nocheh-db
      NOCHEH_STORAGE_LAYOUT: original-only-v1
      NOCHEH_RESET_STATE: "1"
      NOCHEH_ARCHIVE_PASSWORD: ${NOCHEH_ARCHIVE_PASSWORD:?Archive credential required}
      NOCHEH_DERIVED_PASSWORD: ${NOCHEH_DERIVED_PASSWORD:?Derivative credential required}
      NOCHEH_CONTROL_PASSWORD: ${NOCHEH_CONTROL_PASSWORD:?Control credential required}
    depends_on:
      nocheh-db: {condition: service_healthy}
  nocheh-reset-acceptance:
    logging: *logging
    image: nocheh-services:local
    build:
      context: .
      target: runtime
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    profiles: [reset]
    user: "${NOCHEH_UID:-1000}:${NOCHEH_GID:-1000}"
    init: true
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [node, dist/src/stores/reset-acceptance-cli.js, /reset/fresh-acceptance-request.json]
    environment:
      PGHOST: nocheh-db
      NOCHEH_STORAGE_LAYOUT: original-only-v1
      NOCHEH_RESET_ACCEPTANCE: "1"
      NOCHEH_ARCHIVE_PASSWORD: ${NOCHEH_ARCHIVE_PASSWORD:?Archive credential required}
      NOCHEH_DERIVED_PASSWORD: ${NOCHEH_DERIVED_PASSWORD:?Derivative credential required}
      NOCHEH_CONTROL_PASSWORD: ${NOCHEH_CONTROL_PASSWORD:?Control credential required}
    volumes:
      - ${NOCHEH_STATE_DIR:-./data/local}/admin/reset:/reset:ro
    depends_on:
      nocheh-db: {condition: service_healthy}
  nocheh-dashboard:
    <<: *management
    command: [dashboard]
    ports:
      - "127.0.0.1:${NOCHEH_DASHBOARD_PORT:-8783}:${NOCHEH_DASHBOARD_PORT:-8783}"
    healthcheck:
      test: [CMD, python3, -m, tools.runtime.container_service, dashboard-health]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
  nocheh-executor:
    <<: *management
    command: [executor]
    healthcheck:
      test: [CMD, python3, -m, tools.runtime.container_service, executor-health]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  honcho-postgres:
    logging: *logging
    profiles: [honcho]
    restart: unless-stopped
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
    environment:
      # The 18+ images default to /var/lib/postgresql/18/docker; this volume mounts the data directory itself.
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: honcho_experiment
      POSTGRES_USER: experiment
      POSTGRES_PASSWORD_FILE: /run/secrets/honcho_database_password
    secrets: [honcho_database_password]
    volumes: [honcho_database:/var/lib/postgresql/data]
    networks: [honcho-isolated]
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U experiment -d honcho_experiment]
      interval: 3s
      retries: 30
  honcho-redis:
    logging: *logging
    volumes: [honcho_redis:/data]
    profiles: [honcho]
    restart: unless-stopped
    image: redis:8.8.3-trixie@sha256:eb1aa641bc5380ed14442398e45a5a51aeaaac919fab811e4f134eb77c71dd2d
    networks: [honcho-isolated]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      retries: 20
  honcho-api:
    <<: *honcho-runtime
    entrypoint: [sh, -c, '/app/.venv/bin/python scripts/provision_db.py && exec /app/.venv/bin/python /nocheh/run.py api']
    volumes: [./services/honcho:/nocheh:ro]
    networks:
      honcho-isolated: {}
      memory: {aliases: [honcho-memory]}
    depends_on:
      honcho-postgres: {condition: service_healthy}
      honcho-redis: {condition: service_healthy}
      honcho-provider-gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  honcho-deriver:
    <<: *honcho-runtime
    environment: {METRICS_ENABLED: "true"}
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/metrics',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    entrypoint: [/app/.venv/bin/python, /nocheh/run.py, deriver]
    volumes: [./services/honcho:/nocheh:ro]
    depends_on:
      honcho-api: {condition: service_healthy}
  honcho-provider-gateway:
    logging: *logging
    init: true
    environment: {NOCHEH_ARCHIVE_URL: "http://nocheh-app:8780", NOCHEH_MODEL: "${NOCHEH_MEMORY_ROUTE_MODEL:-${NOCHEH_MODEL:-claude-sonnet-5-5}}"}
    profiles: [honcho]
    restart: unless-stopped
    image: python:3.14.8-slim-trixie@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170
    command: [python, /nocheh/meter.py]
    env_file: [{path: "${NOCHEH_HONCHO_STATE_DIR:-./data/local/honcho}/meter.env", required: false}]
    user: "${NOCHEH_UID:-1000}:${NOCHEH_GID:-1000}"
    volumes:
      - ./services/honcho/meter.py:/nocheh/meter.py:ro
      - ./tools/operations/provider/embedding_config.py:/nocheh/embedding_config.py:ro
      - ${NOCHEH_HONCHO_STATE_DIR:-./data/local/honcho}/internal_token:/state/internal_token:ro
      - ${NOCHEH_HONCHO_STATE_DIR:-./data/local/honcho}/ledger:/ledger
    secrets: [temporary_embedding_key]
    networks: [honcho-isolated, honcho-egress, memory]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8790/health',timeout=2)"]
      interval: 5s
      retries: 15
  honcho-cli:
    logging: *logging
    image: nocheh-honcho-cli:0.2.0
    build: {context: ./services/honcho/cli, dockerfile: Dockerfile}
    profiles: [honcho-tools]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - ${NOCHEH_HONCHO_STATE_DIR:-./data/local/honcho}/internal_token:/state/internal_token:ro
    networks: [honcho-isolated]

  nocheh-security:
    <<: *service
    command: [node, dist/src/security/main.js]
    networks: [default, agent]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${NOCHEH_STATE_DIR:-./data/local}/spool:/data/spool:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8786/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      nocheh-app: {condition: service_healthy}

  hermes-agent-sb:
    logging: *logging
    image: nocheh-hermes:local
    command: [python, -m, services.hermes.security_launcher]
    user: "0:0"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Run ./bin/nocheh init}
      NOCHEH_AGENT_NETWORK: ${NOCHEH_AGENT_NETWORK:-nocheh-agent}
      NOCHEH_PARALLEL_RUNS: ${NOCHEH_PARALLEL_RUNS:-4}
      NOCHEH_UID: ${NOCHEH_UID:-1000}
      NOCHEH_GID: ${NOCHEH_GID:-1000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${NOCHEH_STATE_DIR:-./data/local}/hermes/profiles:/profiles:ro
    depends_on:
      nocheh-security: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health',timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
  pgweb-archive:
    logging: *logging
    image: sosedoff/pgweb:0.17.0@sha256:a5256d416e2e8b92d69a4459058e3eca33a9f075d8325491644411d0bc3bd70b
    profiles: [tools]
    restart: unless-stopped
    command: [--bind=0.0.0.0, --listen=8081, --readonly, --lock-session, --no-ssh, --skip-open]
    environment:
      PGWEB_DATABASE_URL: postgres://nocheh_viewer:${NOCHEH_VIEWER_PASSWORD:-}@nocheh-db:5432/nocheh?sslmode=disable
    ports: ["127.0.0.1:8782:8081"]
    depends_on:
      nocheh-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://127.0.0.1:8081/]
      interval: 5s
      timeout: 3s
      retries: 12

  nocheh-db:
    logging: *logging
    image: nocheh-store-postgres:local
    build:
      context: .
      target: store-postgres
    init: true
    environment:
      POSTGRES_USER: nocheh
      POSTGRES_DB: nocheh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Installation administrator credential required}
      NOCHEH_STORAGE_LAYOUT: original-only-v1
      NOCHEH_DATA_DIR: /data
      NOCHEH_ARCHIVE_PASSWORD: ${NOCHEH_ARCHIVE_PASSWORD:?Archive credential required}
      NOCHEH_DERIVED_PASSWORD: ${NOCHEH_DERIVED_PASSWORD:?Derivative credential required}
      NOCHEH_CONTROL_PASSWORD: ${NOCHEH_CONTROL_PASSWORD:?Control credential required}
      INNGEST_POSTGRES_PASSWORD: ${INNGEST_POSTGRES_PASSWORD:?Workflow credential required}
      NOCHEH_WORKFLOW_HISTORY_RETENTION_DAYS: ${NOCHEH_WORKFLOW_HISTORY_RETENTION_DAYS:-0}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${NOCHEH_STATE_DIR:-./data/local}/spool:/data/spool:ro
    healthcheck:
      test: [CMD-SHELL, "test -f /tmp/nocheh-stores-ready && pg_isready -h 127.0.0.1 -U nocheh -d nocheh"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10m
    restart: unless-stopped
    networks: [default, workflows]

  inngest-redis:
    logging: *logging
    image: redis:8.8.3-trixie@sha256:eb1aa641bc5380ed14442398e45a5a51aeaaac919fab811e4f134eb77c71dd2d
    restart: unless-stopped
    user: "${NOCHEH_UID:-1000}:${NOCHEH_GID:-1000}"
    command: [redis-server, --appendonly, "yes", --appendfsync, always, --save, "", --maxmemory-policy, noeviction]
    volumes: ["${NOCHEH_STATE_DIR:-./data/local}/workflows/redis:/data"]
    networks: [workflows]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20

  inngest-server:
    logging: *logging
    image: inngest/inngest:v1.46.0@sha256:9c4a2413bdbfa31a94ff54c32ae2dcc6613dbee84bc76db6cf6644d19e357e3e
    restart: unless-stopped
    command: [inngest, start]
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
      INNGEST_POSTGRES_URI: postgres://nocheh_inngest:${INNGEST_POSTGRES_PASSWORD:-}@nocheh-db:5432/nocheh_inngest?sslmode=disable
      INNGEST_REDIS_URI: redis://inngest-redis:6379
      INNGEST_POSTGRES_MAX_OPEN_CONNS: "10"
      INNGEST_POSTGRES_MAX_IDLE_CONNS: "3"
      LOG_LEVEL: warn
    networks: [workflows]
    depends_on:
      nocheh-app: {condition: service_healthy}
      inngest-redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, inngest, alpha, doctor, healthcheck]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  nocheh-app:
    <<: *service
    stop_grace_period: 300s
    networks: [default, memory, workflows]
    environment:
      <<: *environment
      NOCHEH_SERVICE: nocheh-app
      NOCHEH_MEMORY_TOKEN: ${NOCHEH_MEMORY_TOKEN:-}
      NOCHEH_WORKFLOW_HISTORY_RETENTION_DAYS: ${NOCHEH_WORKFLOW_HISTORY_RETENTION_DAYS:-0}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:-}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:-}
    ports: ["127.0.0.1:${NOCHEH_PORT:-8780}:8780"]
    depends_on:
      nocheh-db: {condition: service_healthy}

  # The Telegram mini app: the only part of Nocheh its tunnel can reach. It
  # holds no credentials and forwards a fixed set of owner routes to the
  # dashboard after checking Telegram's signature on each request.
  nocheh-miniapp:
    logging: *logging
    image: nocheh-miniapp:local
    build:
      context: .
      target: mini-app
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    profiles: [miniapp]
    command: [node, dist/src/mini-app.js]
    user: "${NOCHEH_UID:-1000}:${NOCHEH_GID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [default, miniapp]
    environment:
      TELEGRAM_BOT_ID: ${TELEGRAM_BOT_ID:-}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
      NOCHEH_DASHBOARD_HOST: nocheh-dashboard
      NOCHEH_DASHBOARD_PORT: ${NOCHEH_DASHBOARD_PORT:-8783}
      NOCHEH_MINI_APP_PORT: '8788'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      nocheh-dashboard: {condition: service_started}

  # Cloudflare's tunnel connector: an outbound connection only, no open port.
  # Its public hostname points to http://nocheh-miniapp:8788.
  nocheh-tunnel:
    logging: *logging
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    profiles: [miniapp]
    command: [tunnel, --no-autoupdate, run]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [miniapp]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      nocheh-miniapp: {condition: service_healthy}

  hermes:
    logging: *logging
    image: nocheh-hermes:local
    build:
      context: .
      dockerfile: deploy/hermes.Dockerfile
      additional_contexts:
        hermes_source: ./data/compat/upstreams/hermes-agent
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    user: "${NOCHEH_UID:-1000}:${NOCHEH_GID:-1000}"
    init: true
    restart: unless-stopped
    stop_grace_period: 120s
    ports: ["127.0.0.1:${NOCHEH_NATIVE_ADMIN_PORT:-8785}:8785"]
    environment:
      NOCHEH_STORAGE_LAYOUT: original-only-v1
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Run ./bin/nocheh init}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NOCHEH_CAPTURE_ENABLED: '1'
      NOCHEH_DASHBOARD_HOME: /dashboard-state/home
      NOCHEH_BROWSER_CHAT: '1'
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
      TELEGRAM_GROUP_IDS: ${TELEGRAM_GROUP_IDS:-}
      TELEGRAM_GROUP_ACCESS: ${TELEGRAM_GROUP_ACCESS:-{}}
      TELEGRAM_GROUP_REPLIES: ${TELEGRAM_GROUP_REPLIES:-addressed}
      TELEGRAM_BOT_NAMES: ${TELEGRAM_BOT_NAMES-Nocheh,نوچه}
      GUARD_MODE: ${NOCHEH_GUARD_MODE:-on}
      NOCHEH_SECURITY_RUNTIME: ${NOCHEH_SECURITY_RUNTIME:-isolated}
      NOCHEH_MEMORY_CONTEXT: ${NOCHEH_MEMORY_CONTEXT:-evidence}
      NOCHEH_PARALLEL_REPLIES: ${NOCHEH_PARALLEL_REPLIES:-3}
      NOCHEH_PARALLEL_GUARD_CHECKS: ${NOCHEH_PARALLEL_GUARD_CHECKS:-3}
      NOCHEH_HERMES_JOURNAL_RETENTION_DAYS: ${NOCHEH_HERMES_JOURNAL_RETENTION_DAYS:-0}
      # Settings › Models: replies and secret checks each use their own provider and model.
      NOCHEH_MODEL: ${NOCHEH_REPLY_ROUTE_MODEL:-${NOCHEH_MODEL:-claude-sonnet-5-5}}
      NOCHEH_REPLY_ROUTE_URL: ${NOCHEH_REPLY_ROUTE_URL:-}
      NOCHEH_REPLY_ROUTE_KEY: ${NOCHEH_REPLY_ROUTE_KEY:-}
      # Provider ids label Nocheh's usage tracker rows.
      NOCHEH_REPLY_ROUTE_PROVIDER: ${NOCHEH_REPLY_ROUTE_PROVIDER:-}
      NOCHEH_GUARD_ROUTE_PROVIDER: ${NOCHEH_GUARD_ROUTE_PROVIDER:-}
      NOCHEH_GUARD_ROUTE_URL: ${NOCHEH_GUARD_ROUTE_URL:-}
      NOCHEH_GUARD_ROUTE_MODEL: ${NOCHEH_GUARD_ROUTE_MODEL:-${NOCHEH_MODEL:-claude-sonnet-5-5}}
      NOCHEH_GUARD_ROUTE_KEY: ${NOCHEH_GUARD_ROUTE_KEY:-}
      ARCHIVE_URL: http://nocheh-app:8780
      GUARD_URL: http://nocheh-security:8786
    volumes:
      - ${NOCHEH_STATE_DIR:-./data/local}/admin/dashboard:/dashboard-state
      - ${NOCHEH_STATE_DIR:-./data/local}/hermes:/workspace/data/local/hermes
      - ${NOCHEH_STATE_DIR:-./data/local}/reports:/reports
      - ${NOCHEH_STATE_DIR:-./data/local}/files:/data/files:ro
      - ${NOCHEH_STATE_DIR:-./data/local}/spool:/data/spool
    depends_on:
      nocheh-app: {condition: service_healthy}
      nocheh-security: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8781/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  honcho_database:
    name: ${NOCHEH_HONCHO_DATABASE_VOLUME:-nocheh_honcho_database}
  honcho_redis:
    name: ${NOCHEH_HONCHO_REDIS_VOLUME:-nocheh_honcho_redis}
  postgres_data:

networks:
  honcho-isolated:
    internal: true
  honcho-egress: {}
  workflows:
    internal: true
  agent:
    name: ${NOCHEH_AGENT_NETWORK:-nocheh-agent}
    internal: true
  memory:
    name: ${NOCHEH_MEMORY_NETWORK:-nocheh-memory}
    internal: true
  # Shared only by the mini app and its tunnel, so the tunnel reaches nothing else.
  miniapp: {}

secrets:
  honcho_database_password:
    file: ${NOCHEH_HONCHO_STATE_DIR:-./data/local/honcho}/database_password
  temporary_embedding_key:
    file: ${NOCHEH_HONCHO_STATE_DIR:-./data/local/honcho}/temporary_embedding_key
