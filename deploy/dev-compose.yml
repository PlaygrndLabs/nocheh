# The operating Compose project retains its configuration and data. Source is
# mounted read-only; existing services compile and reload changed code.
services:
  nocheh-db:
    image: ${NOCHEH_DEV_PROJECT:?}:db
    build:
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    restart: "no"

  nocheh-app:
    image: ${NOCHEH_DEV_PROJECT:?}:app
    labels: {com.nocheh.runtime-mode: source-watched}
    build:
      target: development
    restart: "no"
    command: [node, tools/development/dev-app-watch.mjs]
    volumes:
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/src:/app/src:ro
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/dashboard:/app/dashboard:ro
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/tools:/app/tools:ro
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/services/hermes/dashboard:/app/services/hermes/dashboard:ro
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/tsconfig.json:/app/tsconfig.json:ro
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/tsconfig.dashboard.json:/app/tsconfig.dashboard.json:ro
      - dev_dist:/app/dist
      - dev_web_dist:/app/dashboard/dist
      - dev_graph_dist:/app/services/hermes/dashboard/dist

  nocheh-dashboard:
    image: ${NOCHEH_DEV_PROJECT:?}:dashboard
    build:
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    restart: "no"
    environment:
      NOCHEH_DEV_WATCH: "1"
    entrypoint: [python3, -m, tools.development.dev_reload]
    command: [--watch, /app/tools, --, python3, -m, tools.runtime.container_service, dashboard]
    volumes:
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/tools:/app/tools:ro
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/services/hermes/dashboard:/app/services/hermes/dashboard:ro
      - dev_dist:/app/dist:ro
      - dev_web_dist:/app/dashboard/dist:ro
      - dev_graph_dist:/app/services/hermes/dashboard/dist:ro
    depends_on:
      nocheh-app: {condition: service_healthy}

  nocheh-executor:
    image: ${NOCHEH_DEV_PROJECT:?}:executor
    build:
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    restart: "no"
    entrypoint: [python3, -m, tools.development.dev_reload]
    command: [--watch, /app/tools, --watch, /app/dist, --, python3, -m, tools.runtime.container_service, executor]
    volumes:
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/tools:/app/tools:ro
      - dev_dist:/app/dist:ro
    depends_on:
      nocheh-app: {condition: service_healthy}

  nocheh-security:
    image: ${NOCHEH_DEV_PROJECT:?}:security
    restart: "no"
    command: [node, --watch, dist/src/security/main.js]
    volumes:
      - dev_dist:/app/dist:ro
    depends_on:
      nocheh-app: {condition: service_healthy}

  hermes:
    image: ${NOCHEH_DEV_HERMES_BASE:?}
    build: !reset null
    restart: "no"
    environment:
      HOME: /workspace/data/local/hermes
    entrypoint: [python, -m, tools.development.dev_reload]
    command: [--watch, /workspace/services/hermes, --watch, /workspace/tools, --, python, -m, services.hermes.runtime]
    volumes:
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/services:/workspace/services:ro
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/tools:/workspace/tools:ro
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/test/fixtures/acceptance:/workspace/test/fixtures/acceptance:ro
      - dev_graph_dist:/workspace/services/hermes/dashboard/dist:ro

  chatgpt-speech:
    image: ${NOCHEH_DEV_HERMES_BASE:?}
    build: !reset null
    restart: "no"
    entrypoint: [python, -m, tools.development.dev_reload]
    command: [--watch, /workspace/services/hermes, --watch, /workspace/tools, --, python, -m, services.hermes.speech_gateway]
    volumes:
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/services:/workspace/services:ro
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/tools:/workspace/tools:ro

  hermes-agent-sb:
    image: ${NOCHEH_DEV_HERMES_BASE:?}
    build: !reset null
    restart: "no"
    entrypoint: [python, -m, tools.development.dev_reload]
    command: [--watch, /workspace/services/hermes, --watch, /workspace/tools, --, python, -m, services.hermes.security_launcher]
    volumes:
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/services:/workspace/services:ro
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/tools:/workspace/tools:ro

  cliproxy-api:
    image: ${NOCHEH_DEV_PROJECT:?}:cliproxy
    build: !reset null
    restart: "no"
  cliproxy-monitor:
    image: ${NOCHEH_DEV_PROJECT:?}:monitor
    build: !reset null
    restart: "no"
  inngest-redis:
    restart: "no"
  inngest-server:
    restart: "no"

  honcho-postgres:
    restart: "no"
  honcho-redis:
    restart: "no"
  honcho-provider-gateway:
    restart: "no"
    command: [python, /dev_reload.py, --watch, /workspace-honcho, --watch, /workspace-provider, --, python, /workspace-honcho/meter.py]
    environment:
      PYTHONPATH: /workspace-provider
    volumes:
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/tools/development/dev_reload.py:/dev_reload.py:ro
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/services/honcho:/workspace-honcho:ro
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/tools/operations/provider:/workspace-provider:ro
  honcho-api:
    image: ${NOCHEH_DEV_HONCHO_IMAGE:?}
    build: !reset null
    restart: "no"
    entrypoint: [sh, -c, '/app/.venv/bin/python scripts/provision_db.py && exec /app/.venv/bin/python /dev_reload.py --watch /nocheh -- /app/.venv/bin/python /nocheh/run.py api']
    volumes:
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/tools/development/dev_reload.py:/dev_reload.py:ro
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/services/honcho:/nocheh:ro
  honcho-deriver:
    image: ${NOCHEH_DEV_HONCHO_IMAGE:?}
    build: !reset null
    restart: "no"
    entrypoint: [/app/.venv/bin/python, /dev_reload.py]
    command: [--watch, /nocheh, --, /app/.venv/bin/python, /nocheh/run.py, deriver]
    volumes:
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/tools/development/dev_reload.py:/dev_reload.py:ro
      - ${NOCHEH_DEV_SOURCE_ROOT:-.}/services/honcho:/nocheh:ro

volumes:
  dev_dist:
    labels: {com.nocheh.dev.checkout: "${NOCHEH_DEV_SOURCE_ROOT:?}"}
  dev_web_dist:
    labels: {com.nocheh.dev.checkout: "${NOCHEH_DEV_SOURCE_ROOT:?}"}
  dev_graph_dist:
    labels: {com.nocheh.dev.checkout: "${NOCHEH_DEV_SOURCE_ROOT:?}"}
  postgres_data: !override
    external: true
    name: nocheh_postgres_data
  honcho_database: !override
    external: true
    name: ${NOCHEH_HONCHO_DATABASE_VOLUME:?}
  honcho_redis: !override
    external: true
    name: ${NOCHEH_HONCHO_REDIS_VOLUME:?}
