# Opt-in installation wiring. Selected from the saved layout, never a shell flag.
# The full installation rehearsal and activation gates remain separate.
services:
  nocheh-db:
    image: nocheh-store-postgres:local
    build:
      context: .
      target: store-postgres
    init: true
    environment:
      POSTGRES_USER: nocheh
      POSTGRES_DB: nocheh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Installation administrator credential required}
      NOCHEH_STORAGE_LAYOUT: original-only-v1
      NOCHEH_DATA_DIR: /data
      NOCHEH_ARCHIVE_PASSWORD: ${NOCHEH_ARCHIVE_PASSWORD:?Archive credential required}
      NOCHEH_DERIVED_PASSWORD: ${NOCHEH_DERIVED_PASSWORD:?Derivative credential required}
      NOCHEH_CONTROL_PASSWORD: ${NOCHEH_CONTROL_PASSWORD:?Control credential required}
      INNGEST_POSTGRES_PASSWORD: ${INNGEST_POSTGRES_PASSWORD:?Workflow credential required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${NOCHEH_STATE_DIR:-./data/local}/spool:/data/spool:ro
    healthcheck:
      test: [CMD-SHELL, "test -f /tmp/nocheh-stores-ready && pg_isready -h 127.0.0.1 -U nocheh -d nocheh"]
      interval: 3s
      timeout: 3s
      retries: 30
  nocheh-reset-setup:
    image: nocheh-services:local
    build:
      context: .
      target: runtime
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    profiles: [reset]
    user: "${NOCHEH_UID:-1000}:${NOCHEH_GID:-1000}"
    init: true
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [node, dist/src/stores/reset-setup-cli.js, /reset/setup.json]
    environment:
      PGHOST: nocheh-db
      PGPASSWORD: ${POSTGRES_PASSWORD:?Installation administrator credential required}
      NOCHEH_DATA_DIR: /data
      NOCHEH_STORAGE_LAYOUT: original-only-v1
      NOCHEH_RESET_SETUP: "1"
      NOCHEH_ARCHIVE_PASSWORD: ${NOCHEH_ARCHIVE_PASSWORD:?Archive credential required}
      NOCHEH_DERIVED_PASSWORD: ${NOCHEH_DERIVED_PASSWORD:?Derivative credential required}
      NOCHEH_CONTROL_PASSWORD: ${NOCHEH_CONTROL_PASSWORD:?Control credential required}
      INNGEST_POSTGRES_PASSWORD: ${INNGEST_POSTGRES_PASSWORD:?Workflow credential required}
    volumes:
      - ${NOCHEH_STATE_DIR:-./data/local}/spool:/data/spool:ro
      - ${NOCHEH_STATE_DIR:-./data/local}/admin/reset:/reset:ro
    depends_on:
      nocheh-db: {condition: service_healthy}
  nocheh-reset-baseline:
    image: nocheh-services:local
    build:
      context: .
      target: runtime
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    profiles: [reset]
    user: "${NOCHEH_UID:-1000}:${NOCHEH_GID:-1000}"
    init: true
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [node, dist/src/stores/reset-baseline-cli.js, /reset/setup.json]
    environment:
      PGHOST: nocheh-db
      NOCHEH_STORAGE_LAYOUT: original-only-v1
      NOCHEH_RESET_BASELINE: "1"
      NOCHEH_ARCHIVE_PASSWORD: ${NOCHEH_ARCHIVE_PASSWORD:?Archive credential required}
      NOCHEH_DERIVED_PASSWORD: ${NOCHEH_DERIVED_PASSWORD:?Derivative credential required}
      NOCHEH_CONTROL_PASSWORD: ${NOCHEH_CONTROL_PASSWORD:?Control credential required}
    volumes:
      - ${NOCHEH_STATE_DIR:-./data/local}/admin/reset:/reset:ro
    depends_on:
      nocheh-db: {condition: service_healthy}
  nocheh-reset-state:
    image: nocheh-services:local
    build:
      context: .
      target: runtime
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    profiles: [reset]
    user: "${NOCHEH_UID:-1000}:${NOCHEH_GID:-1000}"
    init: true
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [node, dist/src/stores/reset-state-cli.js]
    environment:
      PGHOST: nocheh-db
      NOCHEH_STORAGE_LAYOUT: original-only-v1
      NOCHEH_RESET_STATE: "1"
      NOCHEH_ARCHIVE_PASSWORD: ${NOCHEH_ARCHIVE_PASSWORD:?Archive credential required}
      NOCHEH_DERIVED_PASSWORD: ${NOCHEH_DERIVED_PASSWORD:?Derivative credential required}
      NOCHEH_CONTROL_PASSWORD: ${NOCHEH_CONTROL_PASSWORD:?Control credential required}
    depends_on:
      nocheh-db: {condition: service_healthy}
  nocheh-reset-acceptance:
    image: nocheh-services:local
    build:
      context: .
      target: runtime
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    profiles: [reset]
    user: "${NOCHEH_UID:-1000}:${NOCHEH_GID:-1000}"
    init: true
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [node, dist/src/stores/reset-acceptance-cli.js, /reset/fresh-acceptance-request.json]
    environment:
      PGHOST: nocheh-db
      NOCHEH_STORAGE_LAYOUT: original-only-v1
      NOCHEH_RESET_ACCEPTANCE: "1"
      NOCHEH_ARCHIVE_PASSWORD: ${NOCHEH_ARCHIVE_PASSWORD:?Archive credential required}
      NOCHEH_DERIVED_PASSWORD: ${NOCHEH_DERIVED_PASSWORD:?Derivative credential required}
      NOCHEH_CONTROL_PASSWORD: ${NOCHEH_CONTROL_PASSWORD:?Control credential required}
    volumes:
      - ${NOCHEH_STATE_DIR:-./data/local}/admin/reset:/reset:ro
    depends_on:
      nocheh-db: {condition: service_healthy}
  nocheh-app:
    environment:
      PGUSER: ""
      PGDATABASE: ""
      PGPASSWORD: ""
      INNGEST_POSTGRES_PASSWORD: ""
      NOCHEH_STORAGE_LAYOUT: original-only-v1
      NOCHEH_ARCHIVE_PASSWORD: ${NOCHEH_ARCHIVE_PASSWORD:?Archive credential required}
      NOCHEH_DERIVED_PASSWORD: ${NOCHEH_DERIVED_PASSWORD:?Derivative credential required}
      NOCHEH_CONTROL_PASSWORD: ${NOCHEH_CONTROL_PASSWORD:?Control credential required}
    depends_on:
      nocheh-db: {condition: service_healthy}
  nocheh-security:
    volumes:
      - ${NOCHEH_STATE_DIR:-./data/local}/spool:/data/spool:ro
    environment:
      PGUSER: ""
      PGDATABASE: ""
      PGPASSWORD: ""
      NOCHEH_STORAGE_LAYOUT: original-only-v1
      NOCHEH_ARCHIVE_PASSWORD: ${NOCHEH_ARCHIVE_PASSWORD:?Archive credential required}
      NOCHEH_DERIVED_PASSWORD: ${NOCHEH_DERIVED_PASSWORD:?Derivative credential required}
      NOCHEH_CONTROL_PASSWORD: ${NOCHEH_CONTROL_PASSWORD:?Control credential required}
  hermes:
    environment:
      NOCHEH_STORAGE_LAYOUT: original-only-v1
