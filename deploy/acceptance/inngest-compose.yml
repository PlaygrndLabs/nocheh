# Synthetic acceptance only. Never merge this file with the active installation.
name: ${NOCHEH_FIXTURE_PROJECT:?Explicit fixture project required}
services:
  nocheh-db:
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: nocheh
      POSTGRES_DB: nocheh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Synthetic password required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U nocheh -d nocheh"]
      interval: 2s
      timeout: 3s
      retries: 30
  workflow-bootstrap:
    image: ${NOCHEH_FIXTURE_IMAGE:?Unique fixture image required}
    build: {context: ../.., target: development}
    # Provision only the engine database. The application runtime deliberately
    # refuses administrator credentials; probes own their synthetic schemas.
    command: [node, dist/src/workflows/bootstrap.js]
    environment: &database
      PGHOST: nocheh-db
      PGUSER: nocheh
      PGDATABASE: nocheh
      PGPASSWORD: ${POSTGRES_PASSWORD}
      INNGEST_POSTGRES_PASSWORD: ${INNGEST_POSTGRES_PASSWORD}
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      NOCHEH_DATA_DIR: /tmp/nocheh-fixture
      TELEGRAM_ENABLED: "false"
    depends_on:
      nocheh-db: {condition: service_healthy}
  inngest-redis:
    image: redis:8.10.2-trixie@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --appendfsync, always, --save, "", --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
  inngest-server:
    image: inngest/inngest:v1.49.0@sha256:ad551e89e493e34db74d155be37dc5549930fcb6eb8382e502c17da9762821c7
    restart: unless-stopped
    command: [inngest, start]
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
      INNGEST_POSTGRES_URI: postgres://nocheh_inngest:${INNGEST_POSTGRES_PASSWORD}@nocheh-db:5432/nocheh_inngest?sslmode=disable
      INNGEST_REDIS_URI: redis://inngest-redis:6379
      LOG_LEVEL: error
    depends_on:
      workflow-bootstrap: {condition: service_completed_successfully}
      inngest-redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, inngest, alpha, doctor, healthcheck]
      interval: 3s
      timeout: 5s
      retries: 30
  checks:
    image: ${NOCHEH_FIXTURE_IMAGE}
    profiles: [checks]
    command: [npm, test]
    environment:
      <<: *database
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      NOCHEH_DATA_DIR: /tmp/nocheh-fixture
      INNGEST_BASE_URL: http://inngest-server:8288
      INNGEST_CONNECT_GATEWAY_URL: ws://inngest-server:8289/v0/connect
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
      TELEGRAM_ENABLED: "false"
      NOCHEH_WORKFLOW_FIXTURE: "1"
    depends_on:
      inngest-server: {condition: service_healthy}
networks:
  default: {internal: true}
volumes:
  postgres_data:
  redis_data:
