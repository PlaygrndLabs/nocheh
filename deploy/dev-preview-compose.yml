# One development Compose project. Source is mounted read-only; the builder
# compiles changed files into shared volumes and running services reload them.
services:
  nocheh-dev-builder:
    image: ${NOCHEH_DEV_PROJECT:?}:builder
    build:
      context: .
      target: development
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    user: "${NOCHEH_UID:-1000}:${NOCHEH_GID:-1000}"
    command: [node, scripts/dev-build-watch.mjs]
    restart: "no"
    volumes:
      - ./src:/app/src:ro
      - ./web:/app/web:ro
      - ./scripts:/app/scripts:ro
      - ./integrations/hermes/dashboard:/app/integrations/hermes/dashboard:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.web.json:/app/tsconfig.web.json:ro
      - dev_dist:/app/dist
      - dev_web_dist:/app/web/dist
      - dev_graph_dist:/app/integrations/hermes/dashboard/dist
    healthcheck:
      test: [CMD, node, -e, "const f=require('fs');process.exit(f.existsSync('/app/dist/.dev-ready')&&f.existsSync('/app/web/dist/index.html')?0:1)"]
      interval: 3s
      timeout: 3s
      retries: 40

  nocheh-db:
    image: ${NOCHEH_DEV_PROJECT:?}:db
    build:
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    restart: "no"
    volumes:
      - dev_dist:/app/dist:ro
    depends_on:
      nocheh-dev-builder: {condition: service_healthy}

  nocheh-app:
    image: ${NOCHEH_DEV_PROJECT:?}:app
    restart: "no"
    command: [node, --watch, dist/src/main.js]
    volumes:
      - dev_dist:/app/dist:ro
    depends_on:
      nocheh-dev-builder: {condition: service_healthy}

  nocheh-dashboard:
    image: ${NOCHEH_DEV_PROJECT:?}:dashboard
    build:
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    restart: "no"
    environment:
      NOCHEH_DEV_WATCH: "1"
    entrypoint: [python3, -m, scripts.dev_reload]
    command: [--watch, /app/scripts, --, python3, -m, scripts.container_service, dashboard]
    volumes:
      - ./scripts:/app/scripts:ro
      - ./integrations/hermes/dashboard:/app/integrations/hermes/dashboard:ro
      - dev_dist:/app/dist:ro
      - dev_web_dist:/app/web/dist:ro
      - dev_graph_dist:/app/integrations/hermes/dashboard/dist:ro
    depends_on:
      nocheh-dev-builder: {condition: service_healthy}

  nocheh-executor:
    image: ${NOCHEH_DEV_PROJECT:?}:executor
    build:
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    restart: "no"
    entrypoint: [python3, -m, scripts.dev_reload]
    command: [--watch, /app/scripts, --watch, /app/dist, --, python3, -m, scripts.container_service, executor]
    volumes:
      - ./scripts:/app/scripts:ro
      - dev_dist:/app/dist:ro
    depends_on:
      nocheh-dev-builder: {condition: service_healthy}

  nocheh-security:
    image: ${NOCHEH_DEV_PROJECT:?}:security
    restart: "no"
    command: [node, --watch, dist/src/security/main.js]
    volumes:
      - dev_dist:/app/dist:ro
    depends_on:
      nocheh-dev-builder: {condition: service_healthy}

  hermes:
    image: ${NOCHEH_DEV_HERMES_BASE:?}
    build: !reset null
    restart: "no"
    entrypoint: [python, -m, scripts.dev_reload]
    command: [--watch, /workspace/integrations/hermes, --watch, /workspace/scripts, --, python, -m, integrations.hermes.runtime]
    volumes:
      - ./integrations:/workspace/integrations:ro
      - ./scripts:/workspace/scripts:ro
      - ./compatibility/fixtures:/workspace/compatibility/fixtures:ro
      - dev_graph_dist:/workspace/integrations/hermes/dashboard/dist:ro

  chatgpt-speech:
    image: ${NOCHEH_DEV_HERMES_BASE:?}
    build: !reset null
    restart: "no"
    entrypoint: [python, -m, scripts.dev_reload]
    command: [--watch, /workspace/integrations/hermes, --watch, /workspace/scripts, --, python, -m, integrations.hermes.speech_gateway]
    volumes:
      - ./integrations:/workspace/integrations:ro
      - ./scripts:/workspace/scripts:ro

  hermes-agent-sb:
    image: ${NOCHEH_DEV_HERMES_BASE:?}
    build: !reset null
    restart: "no"
    entrypoint: [python, -m, scripts.dev_reload]
    command: [--watch, /workspace/integrations/hermes, --watch, /workspace/scripts, --, python, -m, integrations.hermes.security_launcher]
    volumes:
      - ./integrations:/workspace/integrations:ro
      - ./scripts:/workspace/scripts:ro

  cliproxy-api:
    image: ${NOCHEH_DEV_PROJECT:?}:cliproxy
    build: !reset null
    restart: "no"
  cliproxy-monitor:
    image: ${NOCHEH_DEV_PROJECT:?}:monitor
    build: !reset null
    restart: "no"
  inngest-redis:
    restart: "no"
  inngest-server:
    restart: "no"

volumes:
  dev_dist:
  dev_web_dist:
  dev_graph_dist:
