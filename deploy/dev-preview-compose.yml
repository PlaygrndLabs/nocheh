# Source is mounted read-only; the existing app service compiles changed files
# into shared volumes and the running services reload them.
services:
  nocheh-db:
    image: ${NOCHEH_DEV_PROJECT:?}:db
    build:
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    restart: "no"

  nocheh-app:
    image: ${NOCHEH_DEV_PROJECT:?}:app
    build:
      target: development
    restart: "no"
    command: [node, tools/development/dev-app-watch.mjs]
    volumes:
      - ./src:/app/src:ro
      - ./dashboard:/app/dashboard:ro
      - ./tools:/app/tools:ro
      - ./services/hermes/dashboard:/app/services/hermes/dashboard:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.dashboard.json:/app/tsconfig.dashboard.json:ro
      - dev_dist:/app/dist
      - dev_web_dist:/app/dashboard/dist
      - dev_graph_dist:/app/services/hermes/dashboard/dist

  nocheh-dashboard:
    image: ${NOCHEH_DEV_PROJECT:?}:dashboard
    build:
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    restart: "no"
    environment:
      NOCHEH_DEV_WATCH: "1"
    entrypoint: [python3, -m, tools.development.dev_reload]
    command: [--watch, /app/tools, --, python3, -m, tools.runtime.container_service, dashboard]
    volumes:
      - ./tools:/app/tools:ro
      - ./services/hermes/dashboard:/app/services/hermes/dashboard:ro
      - dev_dist:/app/dist:ro
      - dev_web_dist:/app/dashboard/dist:ro
      - dev_graph_dist:/app/services/hermes/dashboard/dist:ro
    depends_on:
      nocheh-app: {condition: service_healthy}

  nocheh-executor:
    image: ${NOCHEH_DEV_PROJECT:?}:executor
    build:
      args:
        LOCAL_UID: ${NOCHEH_UID:-1000}
        LOCAL_GID: ${NOCHEH_GID:-1000}
    restart: "no"
    entrypoint: [python3, -m, tools.development.dev_reload]
    command: [--watch, /app/tools, --watch, /app/dist, --, python3, -m, tools.runtime.container_service, executor]
    volumes:
      - ./tools:/app/tools:ro
      - dev_dist:/app/dist:ro
    depends_on:
      nocheh-app: {condition: service_healthy}

  nocheh-security:
    image: ${NOCHEH_DEV_PROJECT:?}:security
    restart: "no"
    command: [node, --watch, dist/src/security/main.js]
    volumes:
      - dev_dist:/app/dist:ro
    depends_on:
      nocheh-app: {condition: service_healthy}

  hermes:
    image: ${NOCHEH_DEV_HERMES_BASE:?}
    build: !reset null
    restart: "no"
    entrypoint: [python, -m, tools.development.dev_reload]
    command: [--watch, /workspace/services/hermes, --watch, /workspace/tools, --, python, -m, services.hermes.runtime]
    volumes:
      - ./services:/workspace/services:ro
      - ./tools:/workspace/tools:ro
      - ./compatibility/fixtures:/workspace/compatibility/fixtures:ro
      - dev_graph_dist:/workspace/services/hermes/dashboard/dist:ro

  chatgpt-speech:
    image: ${NOCHEH_DEV_HERMES_BASE:?}
    build: !reset null
    restart: "no"
    entrypoint: [python, -m, tools.development.dev_reload]
    command: [--watch, /workspace/services/hermes, --watch, /workspace/tools, --, python, -m, services.hermes.speech_gateway]
    volumes:
      - ./services:/workspace/services:ro
      - ./tools:/workspace/tools:ro

  hermes-agent-sb:
    image: ${NOCHEH_DEV_HERMES_BASE:?}
    build: !reset null
    restart: "no"
    entrypoint: [python, -m, tools.development.dev_reload]
    command: [--watch, /workspace/services/hermes, --watch, /workspace/tools, --, python, -m, services.hermes.security_launcher]
    volumes:
      - ./services:/workspace/services:ro
      - ./tools:/workspace/tools:ro

  cliproxy-api:
    image: ${NOCHEH_DEV_PROJECT:?}:cliproxy
    build: !reset null
    restart: "no"
  cliproxy-monitor:
    image: ${NOCHEH_DEV_PROJECT:?}:monitor
    build: !reset null
    restart: "no"
  inngest-redis:
    restart: "no"
  inngest-server:
    restart: "no"

  honcho-postgres:
    restart: "no"
  honcho-redis:
    restart: "no"
  honcho-provider-gateway:
    restart: "no"
    command: [python, /dev_reload.py, --watch, /nocheh, --, python, /nocheh/meter.py]
    volumes:
      - ./tools/development/dev_reload.py:/dev_reload.py:ro
  honcho-api:
    image: ${NOCHEH_DEV_HONCHO_IMAGE:?}
    build: !reset null
    restart: "no"
    entrypoint: [sh, -c, '/app/.venv/bin/python scripts/provision_db.py && exec /app/.venv/bin/python /dev_reload.py --watch /nocheh -- /app/.venv/bin/python /nocheh/run.py api']
    volumes:
      - ./tools/development/dev_reload.py:/dev_reload.py:ro
  honcho-deriver:
    image: ${NOCHEH_DEV_HONCHO_IMAGE:?}
    build: !reset null
    restart: "no"
    entrypoint: [/app/.venv/bin/python, /dev_reload.py]
    command: [--watch, /nocheh, --, /app/.venv/bin/python, /nocheh/run.py, deriver]
    volumes:
      - ./tools/development/dev_reload.py:/dev_reload.py:ro

volumes:
  dev_dist:
    labels: {com.nocheh.dev.checkout: "${NOCHEH_INSTALLATION_ROOT:?}"}
  dev_web_dist:
    labels: {com.nocheh.dev.checkout: "${NOCHEH_INSTALLATION_ROOT:?}"}
  dev_graph_dist:
    labels: {com.nocheh.dev.checkout: "${NOCHEH_INSTALLATION_ROOT:?}"}
  postgres_data:
    labels: {com.nocheh.dev.checkout: "${NOCHEH_INSTALLATION_ROOT:?}"}
  honcho_database: !override
    name: ${NOCHEH_HONCHO_DATABASE_VOLUME:?}
    labels: {com.nocheh.dev.checkout: "${NOCHEH_INSTALLATION_ROOT:?}"}
  honcho_redis: !override
    name: ${NOCHEH_HONCHO_REDIS_VOLUME:?}
    labels: {com.nocheh.dev.checkout: "${NOCHEH_INSTALLATION_ROOT:?}"}
