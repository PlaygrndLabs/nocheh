# Synthetic-only storage acceptance. Never combine with installation Compose.
name: ${NOCHEH_STORES_FIXTURE_PROJECT:?Explicit fixture project required}
services:
  database:
    image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    mem_limit: 512m
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=64, -c, cluster_name=nocheh-stores-fixture]
    environment:
      POSTGRES_USER: nocheh
      POSTGRES_DB: nocheh
      POSTGRES_PASSWORD: stores-fixture-admin-not-a-real-credential
    volumes: [stores_fixture_database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U nocheh -d nocheh"]
      interval: 2s
      timeout: 3s
      retries: 30
  checks:
    image: ${NOCHEH_STORES_FIXTURE_IMAGE:?Explicit fixture image required}
    build: {context: .., target: development}
    profiles: [checks]
    mem_limit: 768m
    command: [node, --test, --test-concurrency=1, dist/test/stores.test.js]
    # Optional container-boundary tests bind synthetic servers inside checks.
    extra_hosts: ["nocheh-app=127.0.0.1", "hermes-runtime=127.0.0.1", "cliproxy-monitor=127.0.0.1"]
    environment:
      PGHOST: database
      PGUSER: nocheh
      PGDATABASE: nocheh
      PGPASSWORD: stores-fixture-admin-not-a-real-credential
      SERVICE_TOKEN: stores-fixture-token-not-a-real-credential
      NOCHEH_STORES_FIXTURE: "1"
      TELEGRAM_ENABLED: "false"
    depends_on:
      database: {condition: service_healthy}
networks:
  default: {internal: true}
volumes:
  stores_fixture_database:
