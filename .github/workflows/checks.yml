# Every test suite, on each pull request and on main: python3 -m tools.development.check_all.
# Synthetic data and made-up credentials only. No repository secrets, no model calls, no write access.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      NODE_VERSION: 26.13.0
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: nocheh
      PGPASSWORD: checks-fixture-not-a-real-credential
      NOCHEH_CHECK_PGPORTS: "5432 5433 5434 5435"
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false

      - name: Start four synthetic Postgres clusters
        run: |
          for port in $NOCHEH_CHECK_PGPORTS; do
            docker run -d --name "postgres-$port" -p "127.0.0.1:$port:5432" -e POSTGRES_USER=nocheh -e POSTGRES_PASSWORD="$PGPASSWORD" \
              postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6 \
              -c cluster_name=nocheh-stores-fixture -c max_connections=200 -c shared_buffers=64MB
          done

      - name: Install Node, uv and ffmpeg
        run: |
          curl -fsSLO "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz"
          curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/SHASUMS256.txt" | grep " node-v$NODE_VERSION-linux-x64.tar.xz\$" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/node" && tar -xJf "node-v$NODE_VERSION-linux-x64.tar.xz" -C "$RUNNER_TEMP/node" --strip-components 1
          rm "node-v$NODE_VERSION-linux-x64.tar.xz"
          echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"
          pipx install --quiet uv==0.13.7
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Install packages and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium

      - name: Wait for Postgres
        run: |
          for port in $NOCHEH_CHECK_PGPORTS; do
            for attempt in $(seq 60); do pg_isready -q -h 127.0.0.1 -p "$port" && break; sleep 1; done
            pg_isready -h 127.0.0.1 -p "$port"
          done

      - name: Run every suite
        run: python3 -m tools.development.check_all --setup

      - name: Keep the results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: data/test-results/
          retention-days: 14
